name: DevHub AI CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub_local_only
          POSTGRES_DB: devhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devhub -d devhub_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://devhub:devhub_local_only@127.0.0.1:5432/devhub_test
      DEVHUB_TEST_DATABASE_URL: postgresql+asyncpg://devhub:devhub_local_only@127.0.0.1:5432/devhub_test
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --project backend --frozen --group dev
      - run: pnpm install --frozen-lockfile
      - run: backend/.venv/bin/ruff check backend/devhub backend/tests backend/migrations
      - run: backend/.venv/bin/pytest backend/tests -q
      - name: Rebuild dedicated test schema using immutable migrations
        run: |
          PGPASSWORD=devhub_local_only psql -h 127.0.0.1 -U devhub -d devhub_test -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          backend/.venv/bin/alembic -c backend/alembic.ini upgrade head
          backend/.venv/bin/alembic -c backend/alembic.ini check
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: python scripts/check_codebase_map.py
